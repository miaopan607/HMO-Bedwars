name: BedWars1058
api-version: '1.13'
version: ${project.version}
author: andrei1058
description: BedWars minigame by andrei1058
main: com.andrei1058.bedwars.BedWars
softdepend: [Vault,PlaceholderAPI,Citizens,Parties,SlimeWorldManager,VipFeatures,Enhanced-SlimeWorldManager,PartyAndFriends,Spigot-Party-API-PAF]
#load: STARTUP
permissions:
  bw.practice.admin:
    description: Allows configuring practice points and the lobby NPC
    default: op
  bw.shout:
    description: Allows sending arena-wide shout messages
    default: true
  bw.global:
    description: Allows sending server-wide chat when permission is required
    default: false
  bw.global.bypass:
    description: Bypasses the server-wide chat cooldown
    default: false
