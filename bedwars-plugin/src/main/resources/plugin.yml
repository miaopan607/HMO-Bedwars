name: HMO-Bedwars
version: ${project.version}
author: andrei1058
description: HMO-Bedwars minigame (Minecraft 1.8.8)
main: com.andrei1058.bedwars.BedWars
softdepend: [PlaceholderAPI,Citizens,SlimeWorldManager,Enhanced-SlimeWorldManager]
#load: STARTUP
permissions:
  bw.rejoin:
    description: Allows rejoining the previous game
    default: true
  bw.shout:
    description: Allows sending arena-wide shout messages
    default: true
  bw.global:
    description: Allows sending server-wide chat when permission is required
    default: false
  bw.global.bypass:
    description: Bypasses the server-wide chat cooldown
    default: false
  bw.blockstart:
    description: Allows blocking arena starts
    default: op
